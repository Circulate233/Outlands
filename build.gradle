buildscript {
    repositories {
        mavenLocal()
        maven {
            name = "Outlands"
            url = 'https://maven.outlands.top/releases/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // :outlands packs 'binpatches.pack.lzma' (LZMA + jar merging) at build time
        classpath 'org.apache.commons:commons-compress:1.28.0'
        classpath 'org.tukaani:xz:1.12'
    }
}

plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.4.1"
}

import top.outlands.gradle.helpers.ProjectConstants
import top.outlands.gradle.helpers.tasks.Util

def sysProps = System.getProperties()

group = 'top.outlands'

// region version -------------------------------------------------------------
// CalVer, YYYY.MM.DD, in UTC so that a build on two different machines on the same day agrees. Nothing else goes
// into the version: no commit distance, no dirty flag, no CI run number. A build is therefore not identifiable by
// its version alone, and repeated builds on one day produce the same file names on purpose (they overwrite rather
// than accumulate).
//
// Same-day releases are only ever numbered at publish time: the first one of the day is 'YYYY.MM.DD', the next ones
// are 'YYYY.MM.DD-2', 'YYYY.MM.DD-3', ... CalVer's RELEASE modifier starts at 2 for the second build, and Maven's
// ComparableVersion ranks '2026.10.23-2' above '2026.10.23', so 'latest'/'release' keep resolving forwards.
//
// CI never invents a suffix of its own: 'Prepare Release' computes it, creates the matching tag, and the tag then
// feeds both values back into the release build (-PcalverDate/-PcalverSuffix), so the published version and the tag
// can not drift apart.
def calverFormat = java.time.format.DateTimeFormatter.ofPattern('yyyy.MM.dd')
def calverDate = (findProperty('calverDate')
        ?: java.time.LocalDate.now(java.time.ZoneOffset.UTC).format(calverFormat)).toString()
def calverSuffix = (findProperty('calverSuffix') ?: '').toString()
if (calverSuffix.startsWith('-')) calverSuffix = calverSuffix.substring(1)
if (!(calverDate ==~ /\d{4}\.\d{2}\.\d{2}/))
    throw new GradleException("calverDate must be YYYY.MM.DD, got '${calverDate}'")
if (calverSuffix && (!(calverSuffix ==~ /\d+/) || calverSuffix.toInteger() < 2))
    throw new GradleException("calverSuffix must be omitted or 2, 3, 4, ... (the CalVer release modifier), got '${calverSuffix}'")

version = calverDate + (calverSuffix ? "-${calverSuffix}" : '')

def version_txt = new File(project.projectDir, "version.txt")
version_txt.write(version.toString())

println "Setting up Outlands ${version}"
println "Java: ${ -> sysProps['java.version']} | JVM: ${ -> sysProps['java.vm.version']} | Vendor: ${ -> sysProps['java.vendor']} | Architecture: ${ -> sysProps['os.arch']}"
// endregion

// Initialize buildSrc
Util.init()

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = options.compilerArgs + ProjectConstants.COMPILER_JVM_ARGUMENTS
    options.encoding = 'UTF-8'
}

idea.project.settings.compiler.javac.javacAdditionalOptions = ProjectConstants.COMPILER_JVM_ARGUMENTS.join(' ')

tasks.register('setup') {
    group = 'setup'
    description = 'Prepares the patched Minecraft sources and the loader workspace.'
    // Lazily resolved so we do not need evaluationDependsOnChildren
    dependsOn ':mcpbase:applyPatches'
}

subprojects {
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs += ProjectConstants.COMPILER_JVM_ARGUMENTS
            options.encoding = 'UTF-8'
        }
    }
}

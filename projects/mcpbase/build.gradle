// ForgeDev based replacement for the ':mcp' + ':minecraft' projects.
//
// The MCP layer owns everything that has to happen before any patch is applied:
//   decompile -> MCPConfig patches -> mcpcleanup (processor) -> rename to MCP names
//
//   * access transformers must run on the *SRG* classes, before the rename, because forge_at.cfg uses SRG names
//   * the processor (mcpcleanup) must run exactly once: it strips every '//' comment, which would destroy comments
//     added by our own patches if it ran afterwards
//
// ':minecraft' had no patches of its own, so it is folded into this project: the "clean" base produced here is
// what 'patches/minecraft' is applied to.

plugins {
    id 'top.outlands.forgedev' version '7.0.0-beta.59-cr1'
}

import com.cleanroommc.gradle.helpers.ProjectConstants

repositories {
    maven {
        name = 'Outlands'
        url = 'https://maven.outlands.top/releases/'
    }
    mavenLocal()
    mavenCentral()
}

def props = project.properties

def mcpArtifactVersion = "${props.minecraft_version}-${props.mcp_version}"

forgedev {
    mcpBase {
        mcpVersion = mcpArtifactVersion
        mcpPipeline = 'joined'

        mappingChannel = props.mapping_channel
        mappingVersion = props.mapping_version

        // mcp_config is published to our own repository
        repositories.add('forge=https://maven.outlands.top/releases/')
        // the repacked config (with the mcpcleanup step) is installed into mavenLocal by :repackedMcpConfig and is
        // referenced by the userdev 'mcp' field, so consumers that execute the config themselves run the cleanup
        repositories.add('local=file://' + new File(System.getProperty('user.home'), '.m2/repository').absolutePath)

        // forge_at.cfg uses SRG names (field_/func_/descriptors), so it has to be applied before the rename
        accessTransformers.from(file("$rootDir/src/main/resources/forge_at.cfg"))

        processor = ProjectConstants.PATCHER_POST_PROCESSOR.tool as String
    }

    // The patch base. Same files as the old ':cleanroom' patcher used, but now every step lives in this project.
    patches {
        base = mcpBase
        patches.set(file("$rootDir/patches/minecraft"))
        patched.set(layout.buildDirectory.dir('patched'))
    }
    patches.apply {
        basePathPrefix.set('before')
        modifiedPathPrefix.set('after')
        // Keep going on rejects so the report lists every failing file instead of stopping at the first one
        failOnError.set(false)
    }
}

tasks.register('mcpInfo') {
    def base = forgedev.mcpBase
    def patches = forgedev.patches
    doLast {
        println 'srg      : ' + base.unnamedSources.get()
        println 'named    : ' + base.namedSources.get()
        println 'patched  : ' + patches.patched.get().asFile
    }
}

// Consumable view of the Minecraft libraries, so other projects can put them on their compile classpath
configurations {
    mcpbaseLibraries {
        canBeConsumed = true
        canBeResolved = true
        extendsFrom(project(':mcpbase').forgedev.mcpBase.dependencyConfiguration)
    }
}

// region mcp_config with the mcpcleanup step ---------------------------------
// Consumers that execute the config themselves (Unimined, ForgeGradle's legacy path) need mcpcleanup inside the
// pipeline; the 543 patches are authored against the cleaned tree. Mavenizer supports generic function steps, so
// the cleanup is declared as data instead of a private 'processor' field.
def mcpConfigVersion = mcpArtifactVersion
def repackedMcpConfig = tasks.register('repackedMcpConfig') {
    def cfg = configurations.detachedConfiguration(
        dependencies.create("de.oceanlabs.mcp:mcp_config:${mcpConfigVersion}@zip")
    )
    inputs.files(cfg)
    def output = layout.buildDirectory.file("mcpconfig/mcp_config-${mcpConfigVersion}.zip")
    outputs.file(output)

    doLast {
        def source = cfg.files.find { it.name.endsWith('.zip') }
        def zip = new java.util.zip.ZipFile(source)
        def out = output.get().asFile
        out.parentFile.mkdirs()
        new java.util.zip.ZipOutputStream(out.newOutputStream()).withCloseable { zos ->
            zip.entries().each { entry ->
                if (entry.directory) return
                def bytes = zip.getInputStream(entry).readAllBytes()
                if (entry.name == 'config.json') {
                    def json = new groovy.json.JsonSlurper().parse(bytes)
                    json.functions = json.functions ?: [:]
                    json.functions.process = [
                        version    : 'net.minecraftforge:mcpcleanup:2.3.2:fatjar',
                        args       : ['--input', '{input}', '--output', '{output}'],
                        java_version: 8
                    ]
                    json.steps.each { side, list ->
                        if (list.any { it.type == 'patch' }) {
                            def patchStep = list.findAll { it.type == 'patch' }.last()
                            def name = patchStep.name ?: 'patch'
                            list.add([type: 'process', input: "{${name}Output}".toString()])
                        }
                    }
                    bytes = new groovy.json.JsonBuilder(json).toPrettyString().getBytes('UTF-8')
                }
                zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                zos.write(bytes)
                zos.closeEntry()
            }
        }
        zip.close()

        // Publish into mavenLocal so consumers can resolve it by coordinate
        def m2 = new File(System.getProperty('user.home'), '.m2/repository/top/outlands/mcp_config/' + mcpConfigVersion)
        m2.mkdirs()
        out.withInputStream { ins -> new File(m2, "mcp_config-${mcpConfigVersion}.zip").withOutputStream { it << ins } }
        new File(m2, "mcp_config-${mcpConfigVersion}.pom").text = """<project>
  <modelVersion>4.0.0</modelVersion>
  <groupId>top.outlands</groupId>
  <artifactId>mcp_config</artifactId>
  <version>${mcpConfigVersion}</version>
</project>
"""
    }
}
// endregion
